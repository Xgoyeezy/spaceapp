name: Bounty Linux validation
on:
  push:
    branches: [validation/60-linux]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - bounty: 62
            revision: f24c35bf5fd8f919f084862e119a25fbfd5ea58f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Export the sanitized public candidate
        working-directory: ${{ github.workspace }}
        run: node scripts/public-export.mjs --output "$RUNNER_TEMP/spaceapp-candidate"
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
        working-directory: ${{ runner.temp }}/spaceapp-candidate
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
        working-directory: ${{ runner.temp }}/spaceapp-candidate
      - run: npm run check
        working-directory: ${{ runner.temp }}/spaceapp-candidate
      - name: All public tests
        id: tests
        continue-on-error: true
        working-directory: ${{ runner.temp }}/spaceapp-candidate
        run: npm test
      - name: Production build
        id: build
        continue-on-error: true
        working-directory: ${{ runner.temp }}/spaceapp-candidate
        run: npm run build
      - name: Summarize
        working-directory: ${{ runner.temp }}/spaceapp-candidate
        run: |
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
